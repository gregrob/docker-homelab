---
services:

  # ------------------------------------------------
  # Setup hawser (agent for Dockhand)
  #
  # https://github.com/Finsys/hawser
  #
  # Standard mode: Dockhand connects to this agent on port 2376.
  # ------------------------------------------------
  hawser:
    image:          ghcr.io/finsys/hawser:${ENV_HAWSER_VERSION:?hawser version required}
    container_name: hawser
    restart:        unless-stopped

    # Deliberately runs as root (the image default); no `user:` set.
    # Hawser deletes stack directories from the Dockhand GUI, and stacks create
    # files as root or as their own container UIDs. A non-root Hawser can't
    # remove those. Running it non-root also needs group_add for the docker
    # socket GID, which differs per host.

    networks:
      - hawser-net

    ports:
      - "2376:2376"

    environment:
      # Where Hawser writes compose files for deployed stacks.
      STACKS_DIR: ${ENV_HAWSER_CONTAINER_PATH_STACKS:?stacks path required}

      # Required: Hawser refuses to start on a non-loopback bind without one.
      # Generate with: openssl rand -base64 32
      TOKEN: ${ENV_HAWSER_TOKEN:?hawser token required}

    volumes:
      # Full control of the host's Docker; keep the token secret.
      - /var/run/docker.sock:/var/run/docker.sock

      # Same path on host and in the container. This is required, not cosmetic:
      # Hawser runs `docker compose` against the HOST daemon, which resolves
      # relative bind mounts (./config:/app/config) on the host filesystem.
      # It must be a host path bind mount, not a named volume, and absolute
      # (use `pwd -P` so symlinks are resolved).
      - ${ENV_HAWSER_CONTAINER_PATH_STACKS:?stacks path required}:${ENV_HAWSER_CONTAINER_PATH_STACKS:?stacks path required}

      # The image declares VOLUME /data/stacks, so Docker creates a new empty
      # anonymous volume there on every container recreate.
      - ${ENV_HAWSER_CONTAINER_PATH_STACKS:?stacks path required}:/data/stacks

networks:
  hawser-net:
    name: hawser-net
    driver: bridge
    
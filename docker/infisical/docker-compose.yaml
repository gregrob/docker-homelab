---

# ------------------------------------------------
# YAML Anchors: Shared database parameters
# ------------------------------------------------
x-postgres-db:       &postgres-db       infisical
x-postgres-user:     &postgres-user     "${ENV_INFISICAL_POSTGRES_USER:?database username required}"
x-postgres-password: &postgres-password "${ENV_INFISICAL_POSTGRES_PASSWORD:?database password required}"
x-postgres-uri:      &postgres-uri      "postgres://${ENV_INFISICAL_POSTGRES_USER}:${ENV_INFISICAL_POSTGRES_PASSWORD}@postgres:5432/infisical"

services:
  # ---------------------------------------------
  # Setup infisical
  #
  # infisical - https://hub.docker.com/r/infisical/infisical
  # 
  # Recommendations for package versions:
  #  https://infisical.com/docs/self-hosting/deployment-options/native/linux-package/installation
  #  As at 25-March-2026 - PostgreSQL v14 and up, Redis V6.x or 7.x
  #
  # Database migration steps for postgres 18 and beyond:
  #  https://medepros.ca/blog/upgrading-to-postgresql-18-in-docker-a-crucial-change-you-need-to-be-aware-of/
  #
  # ---------------------------------------------

  backend:
    image:          infisical/infisical:${ENV_INFISICAL_TAG:-v0.77.0-postgres}
    container_name: infisical-backend
    restart:        unless-stopped

    networks:
      infisical-db-net:
      infisical-net:

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - 90:8080

    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: *postgres-uri
      REDIS_URL: redis://redis:6379
      SITE_URL: http://${ENV_FQDN:?hostname required}:90
      ENCRYPTION_KEY: ${ENV_ENCRYPTION_KEY:?encryption key required}
      AUTH_SECRET: ${ENV_AUTH_SECRET:?auth secret required}

      SMTP_HOST: ${ENV_INFISICAL_EMAIL_HOST:?email host required}
      SMTP_USERNAME: ${ENV_INFISICAL_EMAIL_USERNAME:?email username required}
      SMTP_PASSWORD: ${ENV_INFISICAL_EMAIL_PASSWORD:?email password required}
      SMTP_PORT: ${ENV_INFISICAL_EMAIL_PORT:?email port required}
      SMTP_FROM_ADDRESS: ${ENV_INFISICAL_EMAIL_FROM:?email from address required}
      SMTP_FROM_NAME: ${ENV_INFISICAL_EMAIL_NAME:?email name required}

  # ---------------------------------------------
  # Setup redis
  #
  # redis - https://hub.docker.com/_/redis
  # ---------------------------------------------
  redis:
    image:          docker.io/library/redis:8.10.2-alpine3.23
    container_name: infisical-redis
    restart:        unless-stopped

    networks:
      infisical-db-net:

    user: "${ENV_DOCKER_UID:?admin user id required}:${ENV_DOCKER_GID:?admin group id required}"

    # Expected log warnings (harmless for dev/test):
    #   - "Memory overcommit must be enabled" -> host setting; fix with
    #     `sudo sysctl vm.overcommit_memory=1` (persist in /etc/sysctl.d/99-redis.conf)
    #   - "does not require authentication" -> fine while Redis is internal-only (no ports: published)
    command: --save 60 1 --loglevel warning

    volumes:
      - ./data/host/redis:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------
  # Setup postgres
  #
  # https://hub.docker.com/_/postgres
  # ------------------------------------------------
  postgres:
    image:          docker.io/library/postgres:18.6-alpine3.24
    container_name: infisical-postgres
    restart:        unless-stopped

    # set shared memory limit when using docker compose
    shm_size: 128mb

    networks:
      - infisical-db-net

    # Run as host admin user so mounts are owned by it (needs ENV_DOCKER_UID/GID in .env)
    # NOTE: log shows "chmod: /var/run/postgresql: Operation not permitted" - harmless,
    #       the entrypoint can't chmod as non-root, the socket is still created.
    user: "${ENV_DOCKER_UID:?admin user id required}:${ENV_DOCKER_GID:?admin group id required}"

    environment:
      POSTGRES_DB: *postgres-db
      POSTGRES_USER: *postgres-user
      POSTGRES_PASSWORD: *postgres-password

    volumes:
      - ./data/host/postgres:/var/lib/postgresql

      # initdb needs the uid to resolve in /etc/passwd
      - /etc/passwd:/etc/passwd:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  infisical-net:
    name: infisical-net
    driver: bridge
  infisical-db-net:
    name: infisical-db-net
    driver: bridge
    internal: true

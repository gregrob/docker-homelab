# =============================================================================
# Home Assistant - ha.gregrob.net   (migrated from the old instance)
#
# Needs in HA configuration.yaml (the proxy HA sees is now THIS host):
#   http:
#     use_x_forwarded_for: true
#     trusted_proxies:
#       - <ingress-002 IP>        # add; keep the old Traefik IP until it is retired
#
# NOTE: while the old instance still has its own ha.gregrob.net router, the
# old passthrough rule excludes ha.gregrob.net (see old-traefik/). Remove that
# exclusion (and the old router) when you are ready to cut HA over.
# =============================================================================
http:

  routers:

    homeassistant:
      entryPoints:
        - "https-local"
        - "https-public"                       # HA is reachable externally (via Cloudflare), as on the old box
      rule: "Host(`ha.gregrob.net`)"
      middlewares:
        - public-app                           # no IP allowlist: public traffic arrives from Cloudflare IPs
      tls: {}
      service: homeassistant

  services:

    homeassistant:
      loadBalancer:
        servers:
          - url: "http://192.168.1.85:8123"    # HA is plain http, no certs in HA config
        passHostHeader: true

---

# ------------------------------------------------
# YAML Anchors: Shared database parameters
# ------------------------------------------------
x-postgres-db:       &postgres-db       wiki
x-postgres-user:     &postgres-user     "${ENV_WIKI_POSTGRES_USER:?database username required}"
x-postgres-password: &postgres-password "${ENV_WIKI_POSTGRES_PASSWORD:?database password required}"

services:
  # ---------------------------------------------
  # Setup Wiki.js
  #
  # 1. Alpine (for permission fixer)
  #   https://hub.docker.com/_/alpine
  #
  # 2. Wiki.js
  #   https://github.com/requarks/wiki
  #   https://hub.docker.com/r/requarks/wiki
  # ---------------------------------------------
  
  # 1. The temporary init container to fix /wiki/data/content permissions
  permissions-fixer:
    #image:          alpine:3.24.1
    image:          alpine:3.24.2
    container_name: wiki-permissions-fixer
    network_mode:   none

    volumes:
      - ./data/host/wiki/content:/wiki/data/content
    
    command: chown 1000:1000 /wiki/data/content # Run the chown (node:node, 1000:1000) command and exit, removed -R for recursive

  # 2. Main wiki and database
  wiki:
    #image:          ghcr.io/requarks/wiki:2.5.314
    image:          ghcr.io/requarks/wiki:2.5.316
    container_name: wiki
    restart:        unless-stopped

    depends_on:
      permissions-fixer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    
    init: true # Runs an init process (tini) as PID 1 to handle process signals and clean up zombie processes

    networks:
      - wiki-net
      - wiki-db-net

    ports:
      - "81:3000"

    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: *postgres-user
      DB_PASS: *postgres-password
      DB_NAME: *postgres-db

    volumes:
      - ./data/host/wiki/content:/wiki/data/content
  
  # ------------------------------------------------
  # Setup postgress 
  #
  # https://hub.docker.com/_/postgres
  # ------------------------------------------------
  postgres:
    image:          docker.io/library/postgres:18.6-alpine3.24
    container_name: postgres
    restart:        unless-stopped

    # set shared memory limit when using docker compose
    shm_size: 128mb

    networks:
      - wiki-db-net

    # User set so mounts are written with these permissions
    #user: "${ENV_DOCKER_UID:?admin user id required}:${ENV_DOCKER_GID:?admin group id required}" 

    environment:
      POSTGRES_DB: *postgres-db
      POSTGRES_USER: *postgres-user
      POSTGRES_PASSWORD: *postgres-password

    volumes:
      - ./data/host/postgres:/var/lib/postgresql

      # initdb needs the uid to resolve in /etc/passwd
      #- /etc/passwd:/etc/passwd:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wiki-net:
    name: wiki-net
    driver: bridge
  wiki-db-net:
    name: wiki-db-net
    driver: bridge
    internal: true

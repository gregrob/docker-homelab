---

# ------------------------------------------------
# YAML Anchors: Shared database parameters
# ------------------------------------------------
x-postgres-db:       &postgres-db       wiki
x-postgres-user:     &postgres-user     "${ENV_WIKI_POSTGRES_USER:?database username required}"
x-postgres-password: &postgres-password "${ENV_WIKI_POSTGRES_PASSWORD:?database password required}"

services:
  # ---------------------------------------------
  # Setup Wiki.js
  #
  # 1. Alpine (for permission fixer)
  #   https://hub.docker.com/_/alpine
  #
  # 2. Wiki.js
  #   https://github.com/requarks/wiki
  #   https://hub.docker.com/r/requarks/wiki
  # ---------------------------------------------
  
  # 1. The temporary init container to fix /wiki/data/content permissions
  permissions-fixer:
    image:          alpine:${ENV_ALPINE_VERSION:?alpine version required}
    container_name: wiki-permissions-fixer
    network_mode:   none

    volumes:
      - ./data/host/wiki/content:/wiki/data/content
      - ./data/host/wiki/repo:/wiki/data/repo
    
    # Run chown (node:node, 1000:1000) on both mount points and exit (non-recursive)
    command: chown 1000:1000 /wiki/data/content /wiki/data/repo

  # 2. Main wiki and database
  wiki:
    image:          ghcr.io/requarks/wiki:${ENV_WIKI_VERSION:?wiki version required}
    container_name: wiki
    restart:        unless-stopped

    depends_on:
      permissions-fixer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    
    init: true # Runs an init process (tini) as PID 1 to handle process signals and clean up zombie processes

    networks:
      - wiki-net
      - wiki-db-net

    ports:
      - "81:3000"

    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: *postgres-user
      DB_PASS: *postgres-password
      DB_NAME: *postgres-db

      ADMIN_EMAIL: ${ENV_WIKI_ADMIN_USER:?admin user email required}  # Only used during first setup
      ADMIN_PASS: ${ENV_WIKI_ADMIN_PASSWORD:?admin password required} # Only used during first setup

    volumes:
      - ./data/host/wiki/content:/wiki/data/content
      - ./data/host/wiki/repo:/wiki/data/repo
  
  # ------------------------------------------------
  # Setup postgres
  #
  # https://hub.docker.com/_/postgres
  # ------------------------------------------------
  postgres:
    image:          docker.io/library/postgres:${ENV_POSTGRES_VERSION:?postgres version required}
    container_name: wiki-postgres
    restart:        unless-stopped

    # set shared memory limit when using docker compose
    shm_size: 128mb

    networks:
      - wiki-db-net

    # Run as host admin user so mounts are owned by it (needs ENV_DOCKER_UID/GID in .env)
    # NOTE: log shows "chmod: /var/run/postgresql: Operation not permitted" - harmless,
    #       the entrypoint can't chmod as non-root, the socket is still created.
    user: "${ENV_DOCKER_UID:?admin user id required}:${ENV_DOCKER_GID:?admin group id required}"

    environment:
      POSTGRES_DB: *postgres-db
      POSTGRES_USER: *postgres-user
      POSTGRES_PASSWORD: *postgres-password

    volumes:
      - ./data/host/postgres:/var/lib/postgresql

      # initdb needs the uid to resolve in /etc/passwd
      - /etc/passwd:/etc/passwd:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wiki-net:
    name: wiki-net
    driver: bridge
  wiki-db-net:
    name: wiki-db-net
    driver: bridge
    internal: true

---

# !!! NOTE !!!
# Check these are addressed
# v3.41.3 Should address port forward failures, keep note here 
# until confirmed it is solved.
# https://github.com/qdm12/gluetun/issues/3178
# https://github.com/qdm12/gluetun/issues/3257

# ------------------------------------------------
# YAML Anchor: Common gluetun configuration
# 
# This defines shared configuration that gets reused 
# across multiple gluetun instances using <<: *gluetun-common
#
# https://hub.docker.com/r/qmcgaw/gluetun
# https://github.com/qdm12/gluetun
# ------------------------------------------------
x-gluetun-common: &gluetun-common
  
  #image:   qmcgaw/gluetun:v3.41.1
  image:   qmcgaw/gluetun:v3.41.3 # Should address port forward failures
  
  restart: unless-stopped

  # start_period gives Gluetun 90 seconds to figure itself out
  # before Docker starts counting failures against the retries limit.
  healthcheck:
    start_period: 90s
    interval: 10s
    retries: 5
    timeout: 5s

  cap_add:
    - NET_ADMIN
  
  devices:
    - /dev/net/tun:/dev/net/tun
    
  labels:
    autoheal: "true"

  # Nested anchor for environment variables - reused with <<: *gluetun-common-env
  environment: &gluetun-common-env
    PUID:                 ${ENV_DOCKER_UID:?err}
    PGID:                 ${ENV_DOCKER_GID:?err}
    TZ:                   ${ENV_TZ:?err}
    VPN_SERVICE_PROVIDER: protonvpn
    VPN_TYPE:             wireguard
    SERVER_COUNTRIES:     Switzerland
    HTTPPROXY:            on
    PORT_FORWARD_ONLY:    on
    VPN_PORT_FORWARDING:  on

# ------------------------------------------------
# YAML Anchor: Common qBittorrent configuration
# 
# This defines shared configuration that gets reused 
# across multiple qBittorrent instances using <<: *qbittorrent-common
#
# https://hub.docker.com/r/linuxserver/qbittorrent
# ------------------------------------------------
x-qbittorrent-common: &qbittorrent-common
  #image:   linuxserver/qbittorrent:5.1.4
  image:   linuxserver/qbittorrent:5.2.3
  
  restart: unless-stopped
  
  # Nested anchor for environment variables - reused with <<: *qbittorrent-common-env
  environment: &qbittorrent-common-env
    PUID: ${ENV_DOCKER_UID:?err}
    PGID: ${ENV_DOCKER_GID:?err}
    TZ:   ${ENV_TZ:?err}

# ------------------------------------------------
# YAML Anchor: Common healthcheck timing
#
# Shared interval/timeout/retries/start_period across every
# container's healthcheck — matches Gluetun's own 90s start_period,
# since anything routed through the VPN tunnel (or checking VPN
# reachability) needs that same startup grace window. Each service
# still defines its own `test:` — only the timing is shared here.
# ------------------------------------------------
x-healthcheck-timing: &healthcheck-timing
  start_period: 90s
  interval:     30s
  retries:      3
  timeout:      10s
  
# ------------------------------------------------
# YAML Anchors: Shared downloads mounts
#
# downloads-pub-mount / downloads-prv-mount: the original general-
# purpose downloads folders — unchanged, still used for anything not
# part of the arr-stack automation.
#
# arr-mount: the new unified downloads+media NFS share used by
# Sonarr/Radarr/qBittorrent-pub specifically, so hardlinks work across
# the downloads → media boundary (see the arr-stack folder structure
# note). Only qBittorrent-pub currently touches this — qBittorrent-prv
# has no arr-stack involvement, so it doesn't get this mount.
# ------------------------------------------------
x-downloads-pub-mount: &downloads-pub-mount /mnt/downloads/qbittorrent-pub:/downloads
x-downloads-prv-mount: &downloads-prv-mount /mnt/downloads/qbittorrent-prv:/downloads
x-arr-mount: &arr-mount /mnt/arr:/arr

services:
  # ------------------------------------------------
  # Setup gluetun instances
  # ------------------------------------------------
  gluetun-001:
    <<: *gluetun-common
    container_name: gluetun-001

    networks:
      - gluetun-net

    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks

      - ${ENV_QBITTORRENT_UI_PORT_PUB:?err}:${ENV_QBITTORRENT_UI_PORT_PUB:?err} # for qbittorrent

      - ${ENV_PROWLARR_PORT:?err}:9696/tcp # for prowlarr   

    volumes:
      - ./data/host/gluetun-001/gluetun:/gluetun
      - ./data/host/gluetun-001/tmp:/tmp/gluetun

    environment:
      <<: *gluetun-common-env
      WIREGUARD_PRIVATE_KEY:            ${ENV_WIREGUARD_PRIVATE_KEY_GLUETUN_001:?err}
      
      # --------------------------------------------------------------------------------
      # Dynamic Port Forwarding Configuration
      #
      # Gluetun runs these commands when it successfully negotiates a port (UP) 
      # or loses it (DOWN). They send an API payload to qBittorrent's WebUI to 
      # update the listening port and bind to the VPN interface automatically.
      # 
      # - {{PORT}} and {{VPN_INTERFACE}} are placeholders dynamically filled by Gluetun.
      # - The UP command includes '--tries=30 --waitretry=2' because qBittorrent 
      #   starts AFTER Gluetun. This forces wget to retry for up to 60 seconds, 
      #   waiting for the qBittorrent WebUI to come online and accept the API call.
      # - The DOWN command sets the port to 0 and interface to local loopback ('lo') 
      #   as a killswitch to prevent leaks if the forwarded port is lost.
      #
      # NOTE ON LOGS: You will see an "ERROR" in Gluetun logs that looks like:
      # "ERROR [port forwarding] ... URL:http://127.0.0.1:8080/... [0/0] -> "-" [1]"
      # This is a FALSE POSITIVE. `wget -nv` prints its success summary to stderr, 
      # which Gluetun assumes is a script failure. We don't use `-q` (quiet) to hide 
      # this, because that would also hide genuine API connection failures.      
      # --------------------------------------------------------------------------------
      VPN_PORT_FORWARDING_UP_COMMAND:   /bin/sh -c 'wget -O- -nv --retry-connrefused --tries=30 --waitretry=2 --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:${ENV_QBITTORRENT_UI_PORT_PUB}/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:${ENV_QBITTORRENT_UI_PORT_PUB}/api/v2/app/setPreferences'

  gluetun-002:
    <<: *gluetun-common
    container_name: gluetun-002

    networks:
      - gluetun-net

    ports:
      - 8889:8888/tcp # HTTP proxy
      - 8389:8388/tcp # Shadowsocks
      - 8389:8388/udp # Shadowsocks

      - ${ENV_QBITTORRENT_UI_PORT_PRV:?err}:${ENV_QBITTORRENT_UI_PORT_PRV:?err} # for qbittorrent

    volumes:
      - ./data/host/gluetun-002/gluetun:/gluetun
      - ./data/host/gluetun-002/tmp:/tmp/gluetun

    environment:
      <<: *gluetun-common-env
      WIREGUARD_PRIVATE_KEY:            ${ENV_WIREGUARD_PRIVATE_KEY_GLUETUN_002:?err}
      
      # --------------------------------------------------------------------------------
      # Dynamic Port Forwarding Configuration
      #
      # Gluetun runs these commands when it successfully negotiates a port (UP) 
      # or loses it (DOWN). They send an API payload to qBittorrent's WebUI to 
      # update the listening port and bind to the VPN interface automatically.
      # 
      # - {{PORT}} and {{VPN_INTERFACE}} are placeholders dynamically filled by Gluetun.
      # - The UP command includes '--tries=30 --waitretry=2' because qBittorrent 
      #   starts AFTER Gluetun. This forces wget to retry for up to 60 seconds, 
      #   waiting for the qBittorrent WebUI to come online and accept the API call.
      # - The DOWN command sets the port to 0 and interface to local loopback ('lo') 
      #   as a killswitch to prevent leaks if the forwarded port is lost.
      #
      # NOTE ON LOGS: You will see an "ERROR" in Gluetun logs that looks like:
      # "ERROR [port forwarding] ... URL:http://127.0.0.1:8080/... [0/0] -> "-" [1]"
      # This is a FALSE POSITIVE. `wget -nv` prints its success summary to stderr, 
      # which Gluetun assumes is a script failure. We don't use `-q` (quiet) to hide 
      # this, because that would also hide genuine API connection failures.
      # --------------------------------------------------------------------------------
      VPN_PORT_FORWARDING_UP_COMMAND:   /bin/sh -c 'wget -O- -nv --retry-connrefused --tries=30 --waitretry=2 --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:${ENV_QBITTORRENT_UI_PORT_PRV}/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:${ENV_QBITTORRENT_UI_PORT_PRV}/api/v2/app/setPreferences'

  # ------------------------------------------------
  # Setup qBittorrent
  # ------------------------------------------------
  qbittorrent-pub:
    <<: *qbittorrent-common
    container_name: qbittorrent-pub
    
    network_mode:   "service:gluetun-001"

    healthcheck:
      <<: *healthcheck-timing
      
      # Connection to Cloudflare AND WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf https://1.1.1.1 >/dev/null &&
          curl -sf http://127.0.0.1:$$WEBUI_PORT >/dev/null
    
    labels:
      autoheal: "true"

    depends_on:
      gluetun-001:
        condition: service_healthy
        restart: true

    volumes:
      - ./data/host/qbittorrent-pub/config:/config
      - *downloads-pub-mount
      - *arr-mount
      
    environment:
      <<: *qbittorrent-common-env     
      WEBUI_PORT: ${ENV_QBITTORRENT_UI_PORT_PUB:?err}

  qbittorrent-prv:
    <<: *qbittorrent-common
    container_name: qbittorrent-prv
    
    network_mode:   "service:gluetun-002"

    healthcheck:
      <<: *healthcheck-timing
      
      # Connection to Cloudflare AND WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf https://1.1.1.1 >/dev/null &&
          curl -sf http://127.0.0.1:$$WEBUI_PORT >/dev/null
    
    labels:
      autoheal: "true"

    depends_on:
      gluetun-002:
        condition: service_healthy
        restart: true

    volumes:
      - ./data/host/qbittorrent-prv/config:/config
      - *downloads-prv-mount
      
    environment:
      <<: *qbittorrent-common-env     
      WEBUI_PORT: ${ENV_QBITTORRENT_UI_PORT_PRV:?err}

  # ------------------------------------------------
  # Setup prowlarr 
  #
  # https://hub.docker.com/r/linuxserver/prowlarr
  # https://github.com/linuxserver/docker-prowlarr
  # ------------------------------------------------
  prowlarr:
    #image: lscr.io/linuxserver/prowlarr:2.3.5.5327-ls141
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
    container_name: prowlarr
    restart: unless-stopped

    network_mode:   "service:gluetun-001"

    healthcheck:
      <<: *healthcheck-timing
      
      # Connection to Cloudflare AND WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf https://1.1.1.1 >/dev/null &&
          curl -sf http://127.0.0.1:9696 >/dev/null
    
    labels:
      autoheal: "true"

    depends_on:
      gluetun-001:
        condition: service_healthy
        restart: true
      flaresolverr:
        condition: service_started

    volumes:
      - ./data/host/prowlarr/config:/config

    environment:
      PUID: ${ENV_DOCKER_UID:?err}
      PGID: ${ENV_DOCKER_GID:?err}
      TZ: ${ENV_TZ:?err}

  # ------------------------------------------------
  # Setup flaresolverr
  #
  # https://github.com/FlareSolverr/FlareSolverr
  # ------------------------------------------------
  flaresolverr:
    #image:          ghcr.io/flaresolverr/flaresolverr:v3.4.6
    image:          ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart:        unless-stopped

    network_mode:   "service:gluetun-001"

    healthcheck:
      <<: *healthcheck-timing
      
      # Connection to internet AND FlareSolverr's own API available
      test:
        - CMD-SHELL
        - >-
          curl -sf https://1.1.1.1 >/dev/null &&
          curl -sf http://127.0.0.1:8191/health >/dev/null

    labels:
      autoheal: "true"

    depends_on:
      gluetun-001:
        condition: service_healthy
        restart: true

    volumes:
      - ./data/host/flaresolver/config:/config

    environment:
      TZ: ${ENV_TZ:?err}

  # ------------------------------------------------
  # Setup sonarr 
  #
  # https://hub.docker.com/r/linuxserver/sonarr
  # https://github.com/linuxserver/docker-sonarr
  # ------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls322
    container_name: sonarr
    restart: unless-stopped

    networks:
      - gluetun-net
    
    ports:
      - ${ENV_SONARR_PORT:?err}:8989/tcp # for sonarr  

    healthcheck:
      <<: *healthcheck-timing
      
      # WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:8989 >/dev/null

    labels:
      autoheal: "true"

    depends_on:
      qbittorrent-pub:
        condition: service_healthy

    volumes:
      - ./data/host/sonarr/config:/config
      - *arr-mount

    environment:
      PUID: ${ENV_DOCKER_UID:?err}
      PGID: ${ENV_DOCKER_GID:?err}
      TZ: ${ENV_TZ:?err}

  # ------------------------------------------------
  # Setup radarr 
  #
  # https://hub.docker.com/r/linuxserver/radarr
  # https://github.com/linuxserver/docker-radarr
  # ------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls314
    container_name: radarr
    restart: unless-stopped

    networks:
      - gluetun-net
    
    ports:
      - ${ENV_RADARR_PORT:?err}:7878/tcp # for radarr

    healthcheck:
      <<: *healthcheck-timing
      
      # WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:7878 >/dev/null

    labels:
      autoheal: "true"

    depends_on:
      qbittorrent-pub:
        condition: service_healthy

    volumes:
      - ./data/host/radarr/config:/config
      - *arr-mount

    environment:
      PUID: ${ENV_DOCKER_UID:?err}
      PGID: ${ENV_DOCKER_GID:?err}
      TZ: ${ENV_TZ:?err}

  # ------------------------------------------------
  # Setup seerr-permissions-fixer
  #
  # One-shot container that sets ownership on Seerr's config
  # folder before Seerr itself starts. Runs once and exits —
  # avoids a manual host-side chown, and keeps the correct
  # ownership co-located with the rest of Seerr's config here.
  #
  # Seerr's image runs as the baked-in 'node' user (1000:1000),
  # not your usual PUID/PGID — see the note on the seerr
  # service itself for why.
  # ------------------------------------------------
  seerr-permissions-fixer:
    image:          alpine:3.24.1
    container_name: seerr-permissions-fixer
    
    network_mode:   none
    
    volumes:
      - ./data/host/seerr/config:/seerr/config

    command: chown 1000:1000 /seerr/config

# ------------------------------------------------
  # Setup seerr
  #
  # Successor to Overseerr/Jellyseerr (merged Feb 2026).
  # Rootless by design — runs as the image's own baked-in
  # default user (no 'user:' override here; PUID/PGID env
  # vars also don't work reliably with this image).
  #
  # https://docs.seerr.dev/getting-started/docker
  # https://github.com/seerr-team/seerr
  # ------------------------------------------------
  seerr:
    image:          ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    restart:        unless-stopped
    init:           true

    depends_on:
      seerr-permissions-fixer:
        condition: service_completed_successfully

    networks:
      - gluetun-net
    
    ports:
      - ${ENV_SEERR_PORT:?err}:5055/tcp # for seerr

    environment:
      TZ: ${ENV_TZ:?err}
      LOG_LEVEL: debug
      PORT: 5055

    volumes:
      - ./data/host/seerr/config:/app/config

    healthcheck:
      test:         ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 20s
      timeout:      3s
      interval:     15s      
      retries:      3

    labels:
      autoheal: "true"

  # ------------------------------------------------
  # Setup lidarr 
  #
  # https://hub.docker.com/r/linuxserver/lidarr
  # https://github.com/linuxserver/docker-lidarr
  # ------------------------------------------------
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls40
    container_name: lidarr
    restart: unless-stopped

    networks:
      - gluetun-net
    
    ports:
      - ${ENV_LIDARR_PORT:?err}:8686/tcp # for lidarr

    healthcheck:
      <<: *healthcheck-timing
      
      # WebUI available
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:8686 >/dev/null

    labels:
      autoheal: "true"

    depends_on:
      qbittorrent-pub:
        condition: service_healthy

    volumes:
      - ./data/host/lidarr/config:/config
      - *arr-mount

    environment:
      PUID: ${ENV_DOCKER_UID:?err}
      PGID: ${ENV_DOCKER_GID:?err}
      TZ: ${ENV_TZ:?err}

  # ------------------------------------------------
  # Autoheal - restarts unhealthy containers
  #
  # https://hub.docker.com/r/willfarrell/autoheal
  # ------------------------------------------------
  autoheal:
    image:          willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart:        unless-stopped

    networks:
      - gluetun-net
    
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal

      # How often autoheal checks for unhealthy containers (seconds).
      # 10s is a balance between fast recovery and not hammering the Docker API.
      AUTOHEAL_INTERVAL:        10

      # Grace period (in seconds) before Autoheal starts monitoring the stack.
      # This MUST match Gluetun's 90s healthcheck 'start_period' to prevent 
      # Autoheal from forcefully restarting containers that are still booting up.
      AUTOHEAL_START_PERIOD: 90

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  gluetun-net:
    name: gluetun-net
    driver: bridge

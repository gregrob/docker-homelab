<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/png" href="roblox-icon.png">
  <link rel="apple-touch-icon" href="roblox-icon.png">
  <title>Roblox NextGen</title>
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0;
      text-shadow: 3px 3px 0 #e94560;
    }
    .subtitle {
      font-size: 1.3rem;
      color: #e94560;
      margin-top: 5px;
      margin-bottom: 30px;
    }
    img {
      max-width: 320px;
      width: 80%;
      height: auto;
      border-radius: 12px;
      border: 4px solid #e94560;
      box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
    }
    .message {
      margin-top: 25px;
      font-size: 1.1rem;
      max-width: 500px;
      line-height: 1.5;
    }
    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #888;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🚫 Roblox NextGen</h1>
  <div class="subtitle">Now Loading: Consequences.exe</div>
  <img src="finn.png" alt="denied">
  <div class="message">
    Access temporarily suspended due to <strong>naughty behavior detected</strong>.<br>
    Please negotiate with local management (Mum or Dad) to restore service.
  </div>
  <div class="status">STATUS: BANNED_BY_PARENTS &nbsp;|&nbsp; UPTIME: 0s</div>
</body>
</html>

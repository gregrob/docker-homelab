---
services:
  # ---------------------------------------------
  # Setup spoolman
  #
  # Note this container has a locked 1000:1000 permissions
  #
  # https://github.com/Donkie/Spoolman
  # ---------------------------------------------
  
  spoolman:
    image:          ghcr.io/donkie/spoolman:${ENV_SPOOLMAN_VERSION:?spoolman version required}
    container_name: spoolman
    restart:        unless-stopped

    networks:
      - spoolman-net

    ports:
      - "7912:8000"

    environment:
      TZ: ${ENV_TZ:?err}      

    volumes:
      - ./data/host/spoolman:/home/app/.local/share/spoolman

networks:
  spoolman-net:
    name: spoolman-net
    driver: bridge

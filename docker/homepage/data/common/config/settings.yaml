---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/

logpath: /app/log

iconStyle: theme # Makes sure the icons follow dark / light mode

title: gregrob.net

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

background: 
  image: /images/purple-abstract.jpg
  blur: xl
  brightness: 90
  opacity: 60

layout:
  Infrastructure:
    icon: mdi-server-network
  Monitoring:
    #icon: mdi-pulse-#FFFFFF # Example - This forces white
    icon: mdi-pulse
  Portal:
    icon: mdi-view-dashboard
  Downloads:
    icon: mdi-download
  3D Printing:
    icon: mdi-printer-3d
  AI:
    icon: mdi-robot
  Media & Video:
    icon: mdi-filmstrip
  
    icon: mdi-server-network
  Monitoring:
    #icon: mdi-pulse-#FFFFFF # Example - This forces white
    icon: mdi-pulse
  Compute & Storage:    
    icon: mdi-developer-board
  Portal:
    icon: mdi-view-dashboard
 
  Media Management:
    icon: mdi-movie-open-cog
  Media & Video:
    icon: mdi-filmstrip
  Downloads:
    icon: mdi-download
  Home Automation:
    icon: mdi-home
  
  AI:
    icon: mdi-robot
  3D Printing:
    icon: mdi-printer-3d
  In Development:
    icon: mdi-dev-to

---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# NOTES:
#   1. Use CNAME references in here.  For example monitoring.mgmt.gregrob.net not monitoring-001.mgmt.gregrob.net
#   2. Ubiquiti Firewall - If ping is used - remember to supress signatures on the udmp - GPL ICMP PING *NIX
#   3. Icons can be searched at https://github.com/homarr-labs/dashboard-icons
#
# CATEGORY CONVENTIONS:
#   Grouped by function, not by app type, to stay scalable as services are added:
#     Infrastructure - core plumbing everything else depends on (DNS, future NetBox)
#     Monitoring     - health/observability tooling
#     Portal         - this dashboard + its sibling docs/reference tools (Wiki.js, etc.)
#     Downloads      - acquisition pipeline (rename to "Media" if a media server is ever added)
#     3D Printing    - printer-adjacent tools
#     AI             - local inference tooling
#   New services should slot into an existing category before a new one is created.

- Infrastructure:
    - DNS Primary:
        icon: technitium.png
        href: &technitium_001_url http://dns-001.dns.gregrob.net:5380/
        description: Priority 150 - load-balanced (IPVS)
        siteMonitor: *technitium_001_url
        statusStyle: "dot"

    - DNS Secondary:
        icon: technitium.png    
        href: &technitium_002_url http://dns-002.dns.gregrob.net:5380/
        description: Priority 100 - load-balanced (IPVS)
        siteMonitor: *technitium_002_url
        statusStyle: "dot"

    - DNS Failsafe:
        icon: technitium.png    
        href: &technitium_003_url http://failsafe.dns.gregrob.net:5380/
        description: Priority 50 - standby only, not in the load-balancer pool
        siteMonitor: *technitium_003_url
        statusStyle: "dot"

    - Semaphore UI:
        icon: semaphore.png
        href: &semaphore_url http://ansible.mgmt.gregrob.net:3000/
        description: Web UI for Ansible playbooks and task automation
        siteMonitor: *semaphore_url
        statusStyle: "dot"

- Monitoring:
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: &uptime_kuma_url http://monitoring.mgmt.gregrob.net:3001/
        description: Host and service availability checks
        siteMonitor: *uptime_kuma_url
        statusStyle: "dot"
        widget:
            type: uptimekuma
            url: *uptime_kuma_url
            slug: all-servers

    - Speedtest Tracker:
        icon: speedtest-tracker.png
        href: &speedtest_tracker_url http://tools.mgmt.gregrob.net:8080/
        description: Internet speed monitoring
        siteMonitor: *speedtest_tracker_url
        statusStyle: "dot"
        widget:
            type: speedtest
            url: *speedtest_tracker_url
            version: 2
            key: "{{HOMEPAGE_VAR_SPEEDTEST_TRACKER_KEY}}"
            bitratePrecision: 0

    - Mesh Central:
        icon: meshcentral.png
        href: &meshcentral_url https://monitoring.mgmt.gregrob.net:443/
        description: AMT/vPro out-of-band management
        siteMonitor: *meshcentral_url
        statusStyle: "dot"
        
- Portal:
    - Homepage:
        icon: homepage.png
        href: &homepage_url http://portal.apps.gregrob.net/
        description: This dashboard
        siteMonitor: *homepage_url
        statusStyle: "dot"

    - Wiki.js:
        icon: wikijs.png
        href: &wikijs_url http://portal.apps.gregrob.net:81/
        description: Personal knowledge base and documentation
        siteMonitor: *wikijs_url
        statusStyle: "dot"

- Downloads:
    - Seerr:
        icon: seerr.png
        href: &seerr_url http://download.apps.gregrob.net:5055/
        description: TV series tracking and management
        siteMonitor: *seerr_url
        statusStyle: "dot"
        widget:
            type: seerr
            url: *seerr_url
            key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
            enableQueue: false

    - Sonarr:
        icon: sonarr.png
        href: &sonarr_url http://download.apps.gregrob.net:8989/
        description: TV series tracking and management
        siteMonitor: *sonarr_url
        statusStyle: "dot"
        widget:
            type: sonarr
            url: *sonarr_url
            key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
            enableQueue: false

    - Radarr:
        icon: radarr.png
        href: &radarr_url http://download.apps.gregrob.net:7878/
        description: Movie tracking and management
        siteMonitor: *radarr_url
        statusStyle: "dot"
        widget:
            type: radarr
            url: *radarr_url
            key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
            enableQueue: false

    - Prowlarr:
        icon: prowlarr.png
        href: &prowlarr_url http://download.apps.gregrob.net:9696/
        description: Indexer manager for the *arr stack
        siteMonitor: *prowlarr_url
        statusStyle: "dot"
        widget:
            type: prowlarr
            url: *prowlarr_url
            key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
            enableQueue: false

    - qBittorrent:
        icon: qbittorrent.png
        href: &qbittorrent_pub_url http://download.apps.gregrob.net:8080/
        description: Primary torrent client
        siteMonitor: *qbittorrent_pub_url
        statusStyle: "dot"

    - qBittorrent Backup:
        icon: qbittorrent.png
        href: &qbittorrent_prv_url http://download.apps.gregrob.net:8081/
        description: Secondary torrent client instance
        siteMonitor: *qbittorrent_prv_url
        statusStyle: "dot"

- 3D Printing:
    - Bambuddy:
        icon: /icons/bambuddy.png
        href: &bambuddy_url http://3dprinter.apps.gregrob.net:8000/
        description: Bambu Lab printer monitoring
        siteMonitor: *bambuddy_url
        statusStyle: "dot"

    - Spoolman:
        icon: spoolman.png
        href: &spoolman_url http://3dprinter.apps.gregrob.net:7912/
        description: Filament spool tracking
        siteMonitor: *spoolman_url
        statusStyle: "dot"

- AI:
    - Open WebUI:
        icon: open-webui.png
        href: &open_webui_url http://ollama.apps.gregrob.net:3000/
        description: Chat interface for local Ollama models
        siteMonitor: *open_webui_url
        statusStyle: "dot"

- Media & Video:
    - Jellyfin:
        icon: jellyfin.png
        href: &jellyfin_url http://jellyfin.home.gregrob.net:8096/
        description: Media server and streaming
        siteMonitor: *jellyfin_url
        statusStyle: "dot"
        widget:
            type: jellyfin
            url: *jellyfin_url
            key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
            version: 2
            enableBlocks: true
            fields: ["movies", "series", "episodes"]
            enableNowPlaying: true
            enableUser: true
            enableMediaControl: true
            showEpisodeNumber: true
            expandOneStreamToTwoRows: false

    - Frigate:
        icon: frigate.png
        href: &frigate_url https://frigate.home.gregrob.net:8971/
        description: NVR and object detection
        siteMonitor: *frigate_url
        statusStyle: "dot"
